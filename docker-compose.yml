services:
  postgres:
    image: postgres:18-alpine
    env_file: .env.development
    ports: ["5432:5432"]
    volumes: [postgres18_data:/var/lib/postgresql]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thechoice} -d ${POSTGRES_DB:-thechoice}"], interval: 5s, timeout: 5s, retries: 10 }
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:${SMTP_PORT:-11025}:1025", "127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025"]
  api:
    build: { context: ., dockerfile: docker/Dockerfile.dev }
    working_dir: /workspace
    command: sh -c "pnpm --filter @the-choice/api prisma:generate && pnpm --filter @the-choice/api exec prisma db push && pnpm --filter @the-choice/api prisma:seed && pnpm --filter @the-choice/api start:dev"
    env_file: .env.development
    environment: { DATABASE_URL: "${DATABASE_URL_DOCKER:-postgresql://thechoice:thechoice@postgres:5432/thechoice}", SMTP_HOST: mailpit, SMTP_PORT: "1025", CHOKIDAR_USEPOLLING: "true" }
    ports: ["3000:3000"]
    volumes: [".:/workspace", "dev_node_modules:/workspace/node_modules"]
    depends_on: { postgres: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: docker/Dockerfile.dev }
    working_dir: /workspace
    command: pnpm --filter @the-choice/web start -- --host 0.0.0.0 --port 4201
    environment: { CHOKIDAR_USEPOLLING: "true", WATCHPACK_POLLING: "true" }
    ports: ["4201:4201"]
    volumes: [".:/workspace", "dev_node_modules:/workspace/node_modules"]
    depends_on: [api]
volumes: { postgres18_data: {}, dev_node_modules: {} }
