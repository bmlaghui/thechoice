<button class="favorites-trigger" type="button" (click)="favorites.modalOpen.set(true)" [attr.aria-label]="'Voir mes favoris, ' + favorites.items().length + ' plat(s)'">
  <span aria-hidden="true">♥</span>
  @if (favorites.items().length) { <b>{{ favorites.items().length }}</b> }
</button>

@if (favorites.modalOpen()) {
  <div class="favorites-backdrop" (click)="close()" aria-hidden="true"></div>
  <section class="favorites-panel" role="dialog" aria-modal="true" aria-labelledby="favorites-title">
    <header><div><span class="eyebrow">Votre sélection</span><h2 id="favorites-title">Mes favoris</h2></div><button type="button" (click)="close()" aria-label="Fermer les favoris">×</button></header>
    @if (favorites.items().length) {
      <div class="favorites-list">
        @for (dish of favorites.items(); track dish.slug) {
          <article class="favorite-item">
            <a [routerLink]="['/menu', dish.categorySlug, dish.slug]" (click)="close()"><img [src]="dish.image" [alt]="dish.name"><span><strong>{{ dish.name }}</strong><small>{{ dish.price }}</small></span></a>
            <button type="button" (click)="favorites.remove(dish.slug)" [attr.aria-label]="'Retirer ' + dish.name + ' des favoris'">×</button>
          </article>
        }
      </div>
    } @else {
      <div class="favorites-empty"><span aria-hidden="true">♡</span><h3>Votre sélection est vide</h3><p>Ajoutez les plats qui vous font envie pour les retrouver ici.</p></div>
    }
  </section>
}
